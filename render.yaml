
services:
  - type: web
    name: smart-url-shortener
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: CARGO_HOME
        value: "/opt/render/home/.cargo"
      - key: RUSTUP_HOME
        value: "/opt/render/home/.rustup"
      - key: PIP_CACHE_DIR
        value: "/opt/render/home/.pip-cache"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: "10000"
