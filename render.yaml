services:
  - type: web
    name: smart-url-shortener-api
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-url-shortener-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: true
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app

databases:
  - name: smart-url-shortener-db
    plan: free
